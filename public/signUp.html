<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="bootstrap-5.3.3-dist/css/bootstrap.min.css">
    <link rel="icon" href="hitverse-logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://kit.fontawesome.com/bbacfaf443.js" crossorigin="anonymous"></script>
    <script src="bootstrap-5.3.3-dist/js/bootstrap.bundle.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-auth-compat.js"></script>
    <title>Sign Up | Hitverse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100dvw;
            height: 100dvh;
            object-fit: cover;
            object-position: center;
        }

        main {
            width: 30%;
            height: fit-content;
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
        }

        main img {
            width: 160px;
            height: 32px;
            display: block;
            margin: auto;
        }

        main h1,
        main p {
            color: black;
        }

        .formDiv {
            width: 90%;
        }

        a {
            text-decoration: none;
            color: rgb(101, 1, 167);
            font-weight: 500;
            text-align: center;
            transition: transform 0.3s ease;
        }

        a:hover {
            text-decoration: underline;
            color: rgb(55, 0, 92);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .names input {
            width: 48%;
        }

        input {
            outline: none;
            border: 0.1px solid rgb(228, 228, 228);
            border-radius: 8px;
            padding: 5px;
        }

        input:focus {
            box-shadow: 0px 0px 5px rgb(101, 1, 167);
        }

        .signBtn {
            background-color: rgb(101, 1, 167);
            color: white;
            transition: transform 0.3s ease;
        }

        .signBtn:hover {
            background-color: rgb(55, 0, 92);
            color: white;
        }

        .signBtn:active {
            background-color: rgb(55, 0, 92);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .vidTag {
            top: 0;
            left: 0;
            z-index: -5;
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: fixed;
        }

        .showPass,
        .showPassword {
            top: 50%;
            right: 5px;
            transform: translateY(-20%);
            font-size: 10px;
            z-index: 10;
        }

        .text-danger {
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        @media (max-width: 1200px) {
            main {
                width: 30%;
            }
        }

        @media (max-width: 992px) {
            main {
                width: 40%;
            }
        }

        @media (max-width: 768px) {
            main {
                width: 50%;
            }
        }

        @media (max-width: 576px) {
            main {
                width: 70%;
            }
        }
    </style>
</head>

<body class="position-relative">
    <video muted loop autoplay playsinline class="position-absolute vidTag">
        <source src="bacgVid.mp4" type="video/mp4">
    </video>
    <main class="m-auto p-3 rounded-4 shadow py-5">
        <img src="Music Platform.png" alt="">
        <h1 class="fw-bolder text-center mt-3">Sign Up</h1>
        <div class="reply mt-4"></div>
        <div class=" formDiv mt-5 m-auto">
            <div class="names d-flex justify-content-between">
                <input type="text" placeholder="First Name" id="firstName">
                <input type="text" placeholder="Last Name" id="secName">
            </div>
            <input type="text" placeholder="Email" class="w-100 mt-4" id="emailName">
            <div class="passBlock position-relative h-auto">
                <input type="password" placeholder="Password" class="w-100 mt-4" id="entPass">
                <button class="btn showPass position-absolute" onclick="togglePassShow(entPass, this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <div class="passBlock position-relative h-auto">
                <input type="password" placeholder="Confirm Password" class="w-100 mt-4" id="confPass">
                <button class="btn showPassword position-absolute" onclick="togglePassShow(confPass, this)">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>
            <button class="btn w-100 mt-4 rounded-5 signBtn" onclick="submitForm()">Create your account</button>
        </div>
        <section class="w-100 h-auto mt-4">
            <p class="text-center py-2">Already have an account? <a href="login.html">Login</a></p>
        </section>
    </main>
</body>

</html>

<script>
    let passOne = document.getElementById('entPass')
    let passTwo = document.getElementById('confPass')
    let nameOne = document.getElementById('firstName')
    let nameTwo = document.getElementById('secName')
    let nameThree = document.getElementById('emailName')
    let output = document.querySelector('.reply')
    let onlyBtn = document.querySelector('.signBtn')

    const firebaseConfig = {
        apiKey: "AIzaSyCFl9LtA75ZlOPUxsAIpgaJRRKhPZAhVGY",
        authDomain: "hitvverse.firebaseapp.com",
        projectId: "hitvverse",
        storageBucket: "hitvverse.firebasestorage.app",
        messagingSenderId: "151581483016",
        appId: "1:151581483016:web:3fa4a135104d6d621731bd"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    function togglePassShow(input, button) {
        let myInput = document.getElementById(input);
        if (input.type === 'password') {
            input.type = 'text'
            button.innerHTML = `<i class="fa-solid fa-eye-slash"></i>`
        } else {
            input.type = 'password'
            button.innerHTML = `<i class="fa-solid fa-eye"></i>`
        }
    }
    let spaceChange = () => {
        onlyBtn.innerHTML = `Create your Account`
        onlyBtn.disabled = false
    }
    let countDown = () => {
        setTimeout(() => {
            output.innerHTML = ``
            spaceChange()
        }, 2000);
    }

    function submitForm() {
        onlyBtn.innerHTML = `<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>`
        onlyBtn.disabled = true

        if (!nameOne.value.trim() || !nameTwo.value.trim() || !nameThree.value.trim() || !passOne.value.trim() || !passTwo.value.trim()) {
            output.innerHTML = `<h4 class="text-center text-danger">Please all fields mandatory</h4>`
            countDown()
            return;
        }
        if (passOne.value.trim() !== passTwo.value.trim()) {
            output.innerHTML = `<h4 class="text-center text-danger">Passwords don't match</h4>`
            countDown()
            return;
        }

        const email = nameThree.value.trim();
        const password = passOne.value.trim();

        auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                var user = userCredential.user;
                console.log(user);

                user.updateProfile({
                    displayName: nameOne.value.trim(),

                }).then(() => {
                    output.innerHTML = `<h4 class="text-center text-success">Account Created successfully</h4>`
                    countDown()
                    window.location.href = `login.html`
                    return

                }).catch((error) => {
                    output.innerHTML = `<h4 class="text-center text-danger">${error}</h4>`
                    countDown()
                });

            }).catch((error) => {
                var errorCode = error.code;
                var errorMessage = error.message;
                output.innerHTML = `<h4 class="text-center text-danger">Account already created</h4>`
                countDown()
            }
            );
    }
</script>
